<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Vision AI Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  color: #202b3c;
}

.app {
  display: flex;
  min-height: 100vh;
  max-width: 1400px;
  margin: auto;
  background: white;
}

.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: #f7f9fc;
  border-right: 1px solid #e5e9f0;
  padding: 17px;
  display: flex;
  flex-direction: column;
}

.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 16px;
}

.sidebar h3 {
  margin: 0;
  color: #245b91;
}

.new-chat {
  width: 100%;
  margin-bottom: 17px;
}

.history-heading {
  font-size: 12px;
  color: #8490a0;
  font-weight: bold;
  margin: 8px 0;
}

#conversationList {
  overflow-y: auto;
  flex: 1;
}

.conversation-item {
  width: 100%;
  display: block;
  text-align: left;
  padding: 12px;
  margin-bottom: 5px;
  border-radius: 9px;
  background: transparent;
  color: #33445b;
  font-weight: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversation-item.active {
  background: #dcecff;
  color: #174e84;
  font-weight: bold;
}

.legacy-item {
  background: #fff5df;
  color: #795a19;
}

.sidebar-footer {
  padding-top: 12px;
  border-top: 1px solid #e5e9f0;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.header {
  padding: 17px 20px;
  background: white;
  border-bottom: 1px solid #e5e9f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand h2 {
  margin: 0;
  color: #2563a6;
  font-size: 21px;
}

.brand p {
  margin: 5px 0 0;
  color: #7b8492;
  font-size: 12px;
}

.header-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

button, select {
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  cursor: pointer;
  font-size: 14px;
}

button {
  background: #2869b1;
  color: white;
  font-weight: bold;
}

button:hover { opacity: .88; }

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.secondary {
  background: #edf3fa;
  color: #245b91;
}

.danger {
  background: #fff0f0;
  color: #c03939;
}

select {
  background: #edf3fa;
  color: #245b91;
}

.chat-area {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  padding: 65px 10px 35px;
}

.welcome .logo { font-size: 48px; }

.welcome h1 {
  margin: 12px 0 8px;
  color: #244f7e;
}

.welcome p {
  color: #788493;
  line-height: 1.6;
}

#chatBox {
  min-height: 300px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  display: flex;
  margin: 15px 0;
}

.userMsg { justify-content: flex-end; }
.aiMsg { justify-content: flex-start; }

.bubble {
  max-width: 82%;
  padding: 13px 16px;
  border-radius: 16px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.userMsg .bubble {
  background: #dcecff;
  color: #173d65;
  border-bottom-right-radius: 4px;
}

.aiMsg .bubble {
  background: #f0f2f7;
  color: #26364a;
  border-bottom-left-radius: 4px;
}

.sender {
  display: block;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 5px;
  opacity: .7;
}

.composer {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 12px 20px 18px;
  border-top: 1px solid #e9edf3;
  background: white;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid #d9e1eb;
  border-radius: 15px;
  background: white;
}

#message {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: none;
  outline: none;
  font-size: 16px;
  color: #26364a;
}

#sendBtn { padding: 13px 18px; }

.tools {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 12px;
}

.status {
  text-align: center;
  color: #8993a0;
  font-size: 12px;
  padding: 10px;
}

.footer {
  text-align: center;
  padding: 12px;
  border-top: 1px solid #edf0f4;
}

.footer a {
  color: #2869b1;
  text-decoration: none;
  font-weight: bold;
}

.mobile-menu { display: none; }

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    z-index: 10;
    top: 0;
    bottom: 0;
    left: -290px;
    width: 270px;
    transition: left .2s;
    box-shadow: 3px 0 15px rgba(0,0,0,.08);
  }

  .sidebar.open { left: 0; }

  .mobile-menu { display: inline-block; }

  .header { padding: 12px; }

  .brand h2 { font-size: 17px; }

  .chat-area { padding: 10px; }

  #chatBox { max-height: 55vh; }

  .bubble { max-width: 90%; }

  .composer { padding: 10px; }

  #sendBtn { padding: 12px; }

  button, select {
    font-size: 12px;
    padding: 10px;
  }

  .welcome { padding-top: 40px; }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <h3>💬 My Chats</h3>
      <button class="secondary" onclick="toggleSidebar()">✕</button>
    </div>

    <button class="new-chat" id="newChatBtn" onclick="startNewChat()">
      ＋ New Chat
    </button>

    <div class="history-heading">RECENT CONVERSATIONS</div>
    <div id="conversationList"></div>

    <div class="sidebar-footer">
      <button class="secondary" style="width:100%"
        onclick="location.href='index.html'">
        🏠 Home
      </button>
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="secondary mobile-menu"
          onclick="toggleSidebar()">☰</button>

        <div class="brand">
          <h2>🤖 Vision AI Pro</h2>
          <p>AI Teacher • Ask • Learn • Improve</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="secondary" onclick="startVoice()">🎤 Voice</button>
      </div>
    </header>

    <section class="chat-area">

      <div class="welcome" id="welcome">
        <div class="logo">🤖</div>
        <h1>Welcome to Vision AI Pro</h1>
        <p>Your AI Teacher is ready.<br>
        Ask questions and learn step by step.</p>
      </div>

      <div id="chatBox"></div>

    </section>

    <section class="composer">

      <div class="input-row">
        <input id="message" type="text"
          placeholder="Message Vision AI Pro..."
          autocomplete="off">

        <button id="sendBtn" onclick="sendMessage()">➤ Send</button>
      </div>

      <div class="tools">

        <select id="language">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Hinglish">Hinglish</option>
        </select>

        <button class="secondary" onclick="teacherMode()">
          👨‍🏫 AI Teacher
        </button>

        <button class="secondary" onclick="studyPlanner()">
          📅 Study Planner
        </button>

        <button class="secondary" onclick="progressTracker()">
          📊 Progress
        </button>

      </div>

      <div class="status" id="status">
        Vision AI Pro • Starting...
      </div>

    </section>

    <footer class="footer">
      <a href="index.html">🏠 Home</a>
    </footer>

  </main>

</div>

<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
  "https://swyvrgpapuralxngfoxd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3BE4yCQ_mcVmKDGIvG4mNQ_Etl_7JQr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentConversationId = null;
let currentUserId = null;
let isSending = false;
let isLegacyChat = false;

/* =========================
   BASIC HELPERS
========================= */

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

async function getCurrentSession() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) throw error;

  return data.session;
}

function toggleSidebar() {
  document.getElementById("sidebar")
    .classList.toggle("open");
}

/* =========================
   MESSAGE DISPLAY
========================= */

function addMessage(sender, message, scroll = true) {

  const box = document.getElementById("chatBox");

  document.getElementById("welcome").style.display = "none";

  const row = document.createElement("div");

  row.className =
    sender === "user" ? "message userMsg" : "message aiMsg";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const label = document.createElement("span");
  label.className = "sender";

  label.textContent =
    sender === "user" ? "👤 You" : "🤖 AI Teacher";

  const content = document.createElement("div");
  content.textContent = String(message);

  bubble.appendChild(label);
  bubble.appendChild(content);
  row.appendChild(bubble);
  box.appendChild(row);

  if (scroll) {
    box.scrollTop = box.scrollHeight;
  }
}

function addUserMessage(message, scroll = true) {
  addMessage("user", message, scroll);
}

function addAIMessage(message, scroll = true) {
  addMessage("ai", message, scroll);
}

function clearChatScreen() {
  document.getElementById("chatBox").innerHTML = "";
  document.getElementById("welcome").style.display = "block";
}

/* =========================
   CREATE CONVERSATION
========================= */

async function createConversation() {

  const session = await getCurrentSession();

  if (!session || !session.user) {
    setStatus("Please log in before starting a chat.");
    return null;
  }

  const { data, error } = await supabaseClient
    .from("chat_conversations")
    .insert({
      user_id: session.user.id,
      title: "New Chat"
    })
    .select("id, title, created_at, updated_at")
    .single();

  if (error) {
    console.error("Create conversation error:", error);
    throw error;
  }

  currentConversationId = data.id;
  currentUserId = session.user.id;
  isLegacyChat = false;

  clearChatScreen();

  await loadConversations();

  setStatus("New conversation ready.");

  return data;
}

/* =========================
   NEW CHAT BUTTON
========================= */

async function startNewChat() {

  if (isSending) return;

  try {
    await createConversation();

    document.getElementById("sidebar")
      .classList.remove("open");

    document.getElementById("message").focus();

  } catch (error) {
    console.error(error);
    setStatus("Could not create a new chat.");
  }
}

/* =========================
   LOAD CONVERSATION LIST
========================= */

async function loadConversations() {

  const list = document.getElementById("conversationList");
  list.innerHTML = "";

  const session = await getCurrentSession();

  if (!session || !session.user) {
    list.textContent = "Please log in to view chats.";
    return;
  }

  currentUserId = session.user.id;

  const { data, error } = await supabaseClient
    .from("chat_conversations")
    .select("id, title, updated_at")
    .eq("user_id", currentUserId)
    .order("updated_at", { ascending: false });

  if (error) throw error;

  (data || []).forEach(function(chat) {

    const button = document.createElement("button");

    button.className =
      "conversation-item" +
      (chat.id === currentConversationId ? " active" : "");

    button.textContent = "💬 " + chat.title;
    button.title = chat.title;

    button.onclick = function() {
      openConversation(chat.id);
    };

    list.appendChild(button);

  });

  /* Show older messages that have no conversation ID */

  const { count, error: legacyError } = await supabaseClient
    .from("chat_history")
    .select("id", { count: "exact", head: true })
    .eq("user_id", currentUserId)
    .is("conversation_id", null);

  if (legacyError) {
    console.error("Legacy history check:", legacyError);
  } else if (count > 0) {

    const legacyButton = document.createElement("button");

    legacyButton.className =
      "conversation-item legacy-item" +
      (isLegacyChat ? " active" : "");

    legacyButton.textContent = "📁 Older Messages (" + count + ")";

    legacyButton.onclick = loadLegacyMessages;

    list.appendChild(legacyButton);
  }

}

/* =========================
   OPEN OLD CONVERSATION
========================= */

async function openConversation(conversationId) {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {
      setStatus("Please log in.");
      return;
    }

    const { data: conversation, error: conversationError } =
      await supabaseClient
        .from("chat_conversations")
        .select("id, title")
        .eq("id", conversationId)
        .eq("user_id", session.user.id)
        .single();

    if (conversationError) throw conversationError;

    const { data, error } = await supabaseClient
      .from("chat_history")
      .select("sender, message, created_at")
      .eq("user_id", session.user.id)
      .eq("conversation_id", conversationId)
      .order("created_at", { ascending: true });

    if (error) throw error;

    currentConversationId = conversation.id;
    currentUserId = session.user.id;
    isLegacyChat = false;

    clearChatScreen();

    if (data && data.length > 0) {
      data.forEach(function(item) {
        addMessage(item.sender, item.message, false);
      });
    }

    document.getElementById("chatBox").scrollTop =
      document.getElementById("chatBox").scrollHeight;

    await loadConversations();

    setStatus("Opened: " + conversation.title);

    document.getElementById("sidebar")
      .classList.remove("open");

  } catch (error) {

    console.error("Open conversation error:", error);
    setStatus("Could not open this conversation.");

  }

}

/* =========================
   LOAD OLD UNLINKED MESSAGES
========================= */

async function loadLegacyMessages() {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) return;

    const { data, error } = await supabaseClient
      .from("chat_history")
      .select("sender, message, created_at")
      .eq("user_id", session.user.id)
      .is("conversation_id", null)
      .order("created_at", { ascending: true });

    if (error) throw error;

    currentConversationId = null;
    currentUserId = session.user.id;
    isLegacyChat = true;

    clearChatScreen();

    (data || []).forEach(function(item) {
      addMessage(item.sender, item.message, false);
    });

    document.getElementById("chatBox").scrollTop =
      document.getElementById("chatBox").scrollHeight;

    setStatus("Viewing older saved messages. Start a New Chat to continue.");

    document.getElementById("sidebar")
      .classList.remove("open");

    await loadConversations();

  } catch (error) {
    console.error("Legacy loading error:", error);
    setStatus("Could not load older messages.");
  }

}

/* =========================
   SAVE MESSAGE
========================= */

async function saveChatMessage(sender, message) {

  try {

    if (!currentConversationId || !currentUserId) {
      return false;
    }

    const { error } = await supabaseClient
      .from("chat_history")
      .insert({
        user_id: currentUserId,
        sender: sender,
        message: message,
        conversation_id: currentConversationId
      });

    if (error) throw error;

    return true;

  } catch (error) {

    console.error("History save error:", error);
    setStatus("Warning: Message could not be saved.");
    return false;

  }

}

/* =========================
   AUTOMATIC CHAT TITLE
========================= */

async function updateConversationTitle(message) {

  if (!currentConversationId) return;

  try {

    const { data, error } = await supabaseClient
      .from("chat_conversations")
      .select("title")
      .eq("id", currentConversationId)
      .eq("user_id", currentUserId)
      .single();

    if (error) throw error;

    if (data.title === "New Chat") {

      let title = message
        .replace(/\s+/g, " ")
        .trim();

      if (title.length > 42) {
        title = title.substring(0, 42).trim() + "...";
      }

      const { error: updateError } = await supabaseClient
        .from("chat_conversations")
        .update({
          title: title,
          updated_at: new Date().toISOString()
        })
        .eq("id", currentConversationId)
        .eq("user_id", currentUserId);

      if (updateError) throw updateError;

    } else {

      const { error: timeError } = await supabaseClient
        .from("chat_conversations")
        .update({
          updated_at: new Date().toISOString()
        })
        .eq("id", currentConversationId)
        .eq("user_id", currentUserId);

      if (timeError) throw timeError;

    }

    await loadConversations();

  } catch (error) {
    console.error("Title update error:", error);
  }

}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  if (isSending) return;

  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");

  const messageText = input.value.trim();

  if (!messageText) return;

  isSending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {
      setStatus("Please log in before sending messages.");
      return;
    }

    currentUserId = session.user.id;

    if (!currentConversationId || isLegacyChat) {
      await createConversation();
    }

    input.value = "";

    addUserMessage(messageText);

    await saveChatMessage("user", messageText);

    await updateConversationTitle(messageText);

    setStatus("Vision AI Pro is processing your question...");

    const { data, error } =
      await supabaseClient.functions.invoke(
        "vap-api",
        {
          body: {
            message: messageText,
            request_type: "chat"
          }
        }
      );

    if (error) throw error;

    if (!data || !data.success) {
      throw new Error(data?.error || "Backend request failed.");
    }

    console.log("Vision AI Pro Request:", {
      request_id: data.request_id,
      request_type: data.request_type,
      status: data.status
    });

    const answer = [
      data.message,
      data.received_message
    ].filter(Boolean).join("\n");

    if (!answer) {
      throw new Error("Backend returned an empty response.");
    }

    addAIMessage(answer);

    await saveChatMessage("ai", answer);

    setStatus("Vision AI Pro • Response received");

  } catch (error) {

    console.error("Vision AI Pro Chat Error:", error);

    const errorMessage =
      "I couldn't connect to the backend. Please try again.";

    addAIMessage(errorMessage);

    await saveChatMessage("ai", errorMessage);

    setStatus("Backend connection error.");

  } finally {

    isSending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "➤ Send";
    input.focus();

  }

}

/* =========================
   VOICE INPUT
========================= */

function startVoice() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new Recognition();

  const language =
    document.getElementById("language").value;

  recognition.lang =
    language === "Hindi" ? "hi-IN" : "en-IN";

  recognition.onresult = function(event) {

    document.getElementById("message").value =
      event.results[0][0].transcript;

  };

  recognition.onerror = function(event) {
    console.error("Voice error:", event.error);
    alert("Voice input failed. Please try again.");
  };

  recognition.start();

}

/* =========================
   AI TEACHER
========================= */

function teacherMode() {

  document.getElementById("message").value =
    "Act as my AI Teacher. Explain my question step by step.";

  document.getElementById("message").focus();

}

/* =========================
   STUDY PLANNER
========================= */

function studyPlanner() {

  document.getElementById("message").value =
    "Help me create a study timetable.";

  document.getElementById("message").focus();

}

/* =========================
   PROGRESS TRACKER
========================= */

function progressTracker() {

  document.getElementById("message").value =
    "Help me review my study progress.";

  document.getElementById("message").focus();

}

/* =========================
   ENTER KEY
========================= */

document.getElementById("message").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }

  }
);

/* =========================
   PAGE INITIALIZATION
========================= */

window.addEventListener("load", async function() {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {
      setStatus("Please log in to use your private chat history.");
      return;
    }

    currentUserId = session.user.id;

    await loadConversations();

    const { data, error } = await supabaseClient
      .from("chat_conversations")
      .select("id")
      .eq("user_id", currentUserId)
      .order("updated_at", { ascending: false })
      .limit(1);

    if (error) throw error;

    if (data && data.length > 0) {
      await openConversation(data[0].id);
    } else {
      setStatus("Welcome! Click New Chat to begin.");
    }

  } catch (error) {

    console.error("Initialization error:", error);
    setStatus("Chat initialization warning. Please refresh.");

  }

});

</script>

</body>
</html>
