<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vision AI Pro - AI Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #26364a;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 68px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 20px;
  border-bottom: 1px solid #e8edf3;
  background: #ffffff;
  position: sticky;
  top: 0;
  z-index: 5;
}

.menu-btn {
  width: 42px;
  height: 42px;
  border: 1px solid #e5eaf1;
  border-radius: 11px;
  background: #ffffff;
  color: #315d91;
  font-size: 23px;
}

.menu-btn:hover {
  background: #edf4fc;
}

.brand {
  flex: 1;
  min-width: 0;
}

.brand h2 {
  margin: 0;
  font-size: 20px;
  color: #2464a5;
}

.brand p {
  margin: 4px 0 0;
  font-size: 11px;
  color: #8b96a5;
}

.header-status {
  font-size: 12px;
  color: #718096;
}

/* DRAWER */

.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 31, 49, 0.35);
  z-index: 20;
  visibility: hidden;
  opacity: 0;
  transition: .2s;
}

.drawer-overlay.open {
  visibility: visible;
  opacity: 1;
}

.drawer {
  position: fixed;
  top: 0;
  left: -310px;
  bottom: 0;
  width: 290px;
  max-width: 85vw;
  background: #f8faff;
  z-index: 21;
  padding: 18px;
  display: flex;
  flex-direction: column;
  transition: left .25s ease;
  box-shadow: 5px 0 25px rgba(0,0,0,.08);
}

.drawer.open {
  left: 0;
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 18px;
  border-bottom: 1px solid #e6ebf2;
}

.drawer-header h3 {
  margin: 0;
  font-size: 20px;
  color: #285f99;
}

.close-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: #eaf0f8;
  color: #315d91;
  font-size: 21px;
}

.new-chat-btn {
  margin-top: 18px;
  width: 100%;
  padding: 13px;
  border: 1px solid #cbdcf0;
  border-radius: 11px;
  background: #eaf3ff;
  color: #235f9e;
  font-size: 14px;
  font-weight: bold;
  text-align: left;
}

.new-chat-btn:hover {
  background: #dcecff;
}

.recent-heading {
  margin: 25px 5px 12px;
  color: #8994a3;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .7px;
}

#conversationList {
  flex: 1;
  overflow-y: auto;
}

.conversation-item {
  width: 100%;
  display: block;
  border: none;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 5px;
  background: transparent;
  color: #394c63;
  font-size: 13px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversation-item:hover {
  background: #edf3fa;
}

.conversation-item.active {
  background: #dcecff;
  color: #19558d;
  font-weight: bold;
}

.legacy-item {
  background: #fff3dd;
  color: #785c23;
}

.drawer-footer {
  padding-top: 14px;
  border-top: 1px solid #e6ebf2;
}

.home-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #edf3fa;
  color: #315d91;
  font-weight: bold;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 25px 22px;
}

.welcome {
  text-align: center;
  padding: 85px 10px 45px;
}

.welcome-logo {
  font-size: 58px;
  margin-bottom: 15px;
}

.welcome h1 {
  color: #285c91;
  font-size: 29px;
  margin: 10px 0;
}

.welcome p {
  color: #8591a0;
  line-height: 1.7;
  font-size: 14px;
}

#chatBox {
  display: flex;
  flex-direction: column;
  min-height: 250px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  display: flex;
  margin: 13px 0;
}

.userMsg {
  justify-content: flex-end;
}

.aiMsg {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;
  padding: 14px 17px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.userMsg .bubble {
  background: #e4f0ff;
  color: #234b76;
  border-bottom-right-radius: 4px;
}

.aiMsg .bubble {
  background: #f1f3f7;
  color: #293b50;
  border-bottom-left-radius: 4px;
}

.sender {
  display: block;
  font-size: 11px;
  font-weight: bold;
  opacity: .65;
  margin-bottom: 5px;
}

/* COMPOSER */

.composer {
  width: 100%;
  max-width: 900px;
  padding: 12px 20px 18px;
  margin: auto;
  background: #ffffff;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border: 1px solid #dce3ed;
  border-radius: 16px;
  box-shadow: 0 3px 15px rgba(20,50,90,.05);
}

#message {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 12px;
  font-size: 15px;
  color: #26364a;
  background: transparent;
}

#sendBtn {
  border: none;
  border-radius: 12px;
  padding: 13px 17px;
  background: #2869b1;
  color: white;
  font-weight: bold;
}

#sendBtn:disabled {
  opacity: .5;
}

.tools {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  padding-top: 13px;
}

.tool-btn, #language {
  border: 1px solid #e0e8f1;
  border-radius: 10px;
  background: #f5f8fc;
  color: #315d91;
  padding: 10px 12px;
  font-size: 12px;
}

.status {
  text-align: center;
  color: #8994a2;
  font-size: 11px;
  padding: 12px 5px 3px;
}

.footer {
  text-align: center;
  border-top: 1px solid #edf0f4;
  padding: 14px;
}

.footer a {
  color: #2869b1;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
}

/* MOBILE */

@media(max-width:600px) {

  .header {
    height: 62px;
    padding: 0 12px;
  }

  .brand h2 {
    font-size: 17px;
  }

  .header-status {
    display: none;
  }

  .chat-area {
    padding: 12px;
  }

  .welcome {
    padding-top: 65px;
  }

  .welcome h1 {
    font-size: 23px;
  }

  #chatBox {
    max-height: 55vh;
  }

  .bubble {
    max-width: 91%;
    font-size: 13px;
  }

  .composer {
    padding: 10px;
  }

  #sendBtn {
    padding: 12px;
    font-size: 12px;
  }

  #message {
    font-size: 14px;
  }

  .tool-btn, #language {
    padding: 9px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- CHAT HISTORY DRAWER -->

  <div class="drawer-overlay" id="drawerOverlay"
       onclick="closeDrawer()"></div>

  <aside class="drawer" id="drawer">

    <div class="drawer-header">
      <h3>💬 Chats</h3>
      <button class="close-btn" onclick="closeDrawer()">×</button>
    </div>

    <button class="new-chat-btn" onclick="startNewChat()">
      ＋ &nbsp; New Chat
    </button>

    <div class="recent-heading">RECENT CHATS</div>

    <div id="conversationList">
      <div style="padding:10px;color:#8793a2;font-size:13px">
        Loading conversations...
      </div>
    </div>

    <div class="drawer-footer">
      <button class="home-btn" onclick="location.href='index.html'">
        🏠 Home
      </button>
    </div>

  </aside>

  <!-- HEADER -->

  <header class="header">

    <button class="menu-btn" onclick="openDrawer()"
            aria-label="Open chat history">
      ☰
    </button>

    <div class="brand">
      <h2>🤖 Vision AI Pro</h2>
      <p>AI Teacher • Ask • Learn • Improve</p>
    </div>

    <div class="header-status">
      AI Chat
    </div>

  </header>

  <!-- MAIN CHAT -->

  <main class="chat-area">

    <div class="welcome" id="welcome">

      <div class="welcome-logo">🤖</div>

      <h1>Welcome to Vision AI Pro</h1>

      <p>
        Your AI Teacher is ready.<br>
        Ask questions and learn step by step.
      </p>

    </div>

    <div id="chatBox"></div>

  </main>

  <!-- MESSAGE INPUT -->

  <section class="composer">

    <div class="input-row">

      <input
        id="message"
        type="text"
        placeholder="Message Vision AI Pro..."
        autocomplete="off"
      >

      <button id="sendBtn" onclick="sendMessage()">
        ➤
      </button>

    </div>

    <div class="tools">

      <select id="language">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Hinglish">Hinglish</option>
      </select>

      <button class="tool-btn" onclick="teacherMode()">
        👨‍🏫 AI Teacher
      </button>

      <button class="tool-btn" onclick="studyPlanner()">
        📅 Study Planner
      </button>

      <button class="tool-btn" onclick="progressTracker()">
        📊 Progress
      </button>

    </div>

    <div class="status" id="status">
      Vision AI Pro • Connecting...
    </div>

  </section>

  <footer class="footer">
    <a href="index.html">🏠 Home</a>
  </footer>

</div>

<script>

/* ==================================
   SUPABASE CONNECTION
================================== */

const SUPABASE_URL =
"https://swyvrgpapuralxngfoxd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_3BE4yCQ_mcVmKDGIvG4mNQ_Etl_7JQr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentConversationId = null;
let currentUserId = null;
let isSending = false;
let isLegacyChat = false;


/* ==================================
   STATUS
================================== */

function setStatus(message) {
  document.getElementById("status").textContent = message;
}


/* ==================================
   DRAWER OPEN AND CLOSE
================================== */

function openDrawer() {

  document.getElementById("drawer").classList.add("open");

  document.getElementById("drawerOverlay")
    .classList.add("open");

}

function closeDrawer() {

  document.getElementById("drawer").classList.remove("open");

  document.getElementById("drawerOverlay")
    .classList.remove("open");

}


/* ==================================
   SESSION
================================== */

async function getCurrentSession() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) throw error;

  return data.session;

}


/* ==================================
   MESSAGE DISPLAY
================================== */

function addMessage(sender, message, scroll = true) {

  const box = document.getElementById("chatBox");

  document.getElementById("welcome").style.display = "none";

  const row = document.createElement("div");

  row.className =
    sender === "user" ? "message userMsg" : "message aiMsg";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const label = document.createElement("span");
  label.className = "sender";

  label.textContent =
    sender === "user" ? "👤 You" : "🤖 AI Teacher";

  const content = document.createElement("div");
  content.textContent = String(message);

  bubble.appendChild(label);
  bubble.appendChild(content);

  row.appendChild(bubble);
  box.appendChild(row);

  if (scroll) {
    box.scrollTop = box.scrollHeight;
  }

}

function clearChatScreen() {

  document.getElementById("chatBox").innerHTML = "";

  document.getElementById("welcome").style.display = "block";

}


/* ==================================
   LOAD CONVERSATIONS
================================== */

async function loadConversations() {

  const list = document.getElementById("conversationList");

  list.innerHTML = "";

  const session = await getCurrentSession();

  if (!session || !session.user) {

    list.textContent = "Please log in to view your chats.";

    return;

  }

  currentUserId = session.user.id;

  const { data, error } = await supabaseClient
    .from("chat_conversations")
    .select("id, title, updated_at")
    .eq("user_id", currentUserId)
    .order("updated_at", { ascending: false });

  if (error) throw error;

  (data || []).forEach(function(chat) {

    const button = document.createElement("button");

    button.className =
      "conversation-item" +
      (chat.id === currentConversationId ? " active" : "");

    button.textContent = "💬 " + chat.title;

    button.title = chat.title;

    button.onclick = function() {
      openConversation(chat.id);
    };

    list.appendChild(button);

  });

  /* OLD CHAT HISTORY */

  const { count, error: legacyError } = await supabaseClient
    .from("chat_history")
    .select("id", { count: "exact", head: true })
    .eq("user_id", currentUserId)
    .is("conversation_id", null);

  if (legacyError) {

    console.error("Legacy history error:", legacyError);

  } else if (count > 0) {

    const button = document.createElement("button");

    button.className =
      "conversation-item legacy-item" +
      (isLegacyChat ? " active" : "");

    button.textContent = "📁 Older Messages (" + count + ")";

    button.onclick = loadLegacyMessages;

    list.appendChild(button);

  }

  if (!data || data.length === 0) {

    if (!count) {

      const empty = document.createElement("div");

      empty.style.cssText =
        "padding:12px;color:#8994a2;font-size:13px";

      empty.textContent = "No conversations yet.";

      list.appendChild(empty);

    }

  }

}


/* ==================================
   CREATE NEW CHAT
================================== */

async function createConversation() {

  const session = await getCurrentSession();

  if (!session || !session.user) {

    throw new Error("Please log in before starting a chat.");

  }

  const { data, error } = await supabaseClient
    .from("chat_conversations")
    .insert({
      user_id: session.user.id,
      title: "New Chat"
    })
    .select("id, title, created_at, updated_at")
    .single();

  if (error) throw error;

  currentConversationId = data.id;

  currentUserId = session.user.id;

  isLegacyChat = false;

  clearChatScreen();

  await loadConversations();

  setStatus("New conversation ready.");

  return data;

}


/* ==================================
   NEW CHAT BUTTON
================================== */

async function startNewChat() {

  if (isSending) return;

  try {

    await createConversation();

    closeDrawer();

    document.getElementById("message").focus();

  } catch (error) {

    console.error("New chat error:", error);

    setStatus("New Chat Error: " + error.message);

  }

}


/* ==================================
   OPEN EXISTING CHAT
================================== */

async function openConversation(conversationId) {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {

      throw new Error("Please log in first.");

    }

    const { data: conversation, error: conversationError } =
      await supabaseClient
        .from("chat_conversations")
        .select("id, title")
        .eq("id", conversationId)
        .eq("user_id", session.user.id)
        .single();

    if (conversationError) throw conversationError;

    const { data, error } = await supabaseClient
      .from("chat_history")
      .select("sender, message, created_at")
      .eq("user_id", session.user.id)
      .eq("conversation_id", conversationId)
      .order("created_at", { ascending: true });

    if (error) throw error;

    currentConversationId = conversation.id;

    currentUserId = session.user.id;

    isLegacyChat = false;

    clearChatScreen();

    (data || []).forEach(function(item) {

      addMessage(item.sender, item.message, false);

    });

    document.getElementById("chatBox").scrollTop =
      document.getElementById("chatBox").scrollHeight;

    await loadConversations();

    setStatus("Opened: " + conversation.title);

    closeDrawer();

  } catch (error) {

    console.error("Open chat error:", error);

    setStatus("Open Chat Error: " + error.message);

  }

}


/* ==================================
   LOAD OLDER MESSAGES
================================== */

async function loadLegacyMessages() {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {
      throw new Error("Please log in.");
    }

    const { data, error } = await supabaseClient
      .from("chat_history")
      .select("sender, message, created_at")
      .eq("user_id", session.user.id)
      .is("conversation_id", null)
      .order("created_at", { ascending: true });

    if (error) throw error;

    currentConversationId = null;

    currentUserId = session.user.id;

    isLegacyChat = true;

    clearChatScreen();

    (data || []).forEach(function(item) {

      addMessage(item.sender, item.message, false);

    });

    await loadConversations();

    setStatus("Viewing older messages. Start New Chat to continue.");

    closeDrawer();

  } catch (error) {

    console.error("Legacy chat error:", error);

    setStatus("History Error: " + error.message);

  }

}


/* ==================================
   SAVE MESSAGE
================================== */

async function saveChatMessage(sender, message) {

  if (!currentConversationId || !currentUserId) {

    console.error("Missing conversation or user ID.");

    return false;

  }

  const { error } = await supabaseClient
    .from("chat_history")
    .insert({
      user_id: currentUserId,
      conversation_id: currentConversationId,
      sender: sender,
      message: message
    });

  if (error) {

    console.error("Message save error:", error);

    setStatus("History Save Error: " + error.message);

    return false;

  }

  return true;

}


/* ==================================
   UPDATE CHAT TITLE
================================== */

async function updateConversationTitle(message) {

  if (!currentConversationId || !currentUserId) return;

  try {

    const { data, error } = await supabaseClient
      .from("chat_conversations")
      .select("title")
      .eq("id", currentConversationId)
      .eq("user_id", currentUserId)
      .single();

    if (error) throw error;

    let title = data.title;

    if (title === "New Chat") {

      title = message.replace(/\s+/g, " ").trim();

      if (title.length > 42) {

        title = title.substring(0, 42).trim() + "...";

      }

    }

    const { error: updateError } = await supabaseClient
      .from("chat_conversations")
      .update({
        title: title,
        updated_at: new Date().toISOString()
      })
      .eq("id", currentConversationId)
      .eq("user_id", currentUserId);

    if (updateError) throw updateError;

    await loadConversations();

  } catch (error) {

    console.error("Title update error:", error);

  }

}


/* ==================================
   SEND MESSAGE
================================== */

async function sendMessage() {

  if (isSending) return;

  const input = document.getElementById("message");

  const sendBtn = document.getElementById("sendBtn");

  const messageText = input.value.trim();

  if (!messageText) return;

  isSending = true;

  sendBtn.disabled = true;

  sendBtn.textContent = "...";

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {

      throw new Error("Please log in before sending messages.");

    }

    currentUserId = session.user.id;

    if (!currentConversationId || isLegacyChat) {

      await createConversation();

    }

    input.value = "";

    addMessage("user", messageText);

    const saved = await saveChatMessage("user", messageText);

    if (!saved) {

      throw new Error("Your message could not be saved to chat history.");

    }

    await updateConversationTitle(messageText);

    setStatus("Processing your question...");

    const { data, error } =
      await supabaseClient.functions.invoke(
        "vap-api",
        {
          body: {
            message: messageText,
            request_type: "chat",
            language: document.getElementById("language").value
          }
        }
      );

    if (error) {

      let details = error.message || "Function request failed.";

      if (error.context) {

        try {

          details += "\n" + await error.context.clone().text();

        } catch (readError) {

          console.error(readError);

        }

      }

      throw new Error(details);

    }

    if (!data || !data.success) {

      throw new Error(
        data?.error || "Backend returned an unsuccessful response."
      );

    }

    const answer = [
      data.message,
      data.received_message
    ].filter(Boolean).join("\n");

    if (!answer) {

      throw new Error("Backend returned an empty answer.");

    }

    addMessage("ai", answer);

    const aiSaved = await saveChatMessage("ai", answer);

    if (!aiSaved) {

      setStatus("Answer received, but history saving failed.");

    } else {

      setStatus("Vision AI Pro • Response received");

    }

  } catch (error) {

    console.error("FULL BACKEND ERROR:", error);

    const details =
      error?.message || String(error);

    addMessage(
      "ai",
      "⚠️ Technical Error\n\n" + details
    );

    setStatus("Request failed. See the technical error above.");

  } finally {

    isSending = false;

    sendBtn.disabled = false;

    sendBtn.textContent = "➤";

    input.focus();

  }

}


/* ==================================
   VOICE INPUT
================================== */

function startVoice() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {

    alert("Voice input is not supported in this browser.");

    return;

  }

  const recognition = new Recognition();

  const language =
    document.getElementById("language").value;

  recognition.lang =
    language === "Hindi" ? "hi-IN" : "en-IN";

  recognition.onresult = function(event) {

    document.getElementById("message").value =
      event.results[0][0].transcript;

  };

  recognition.onerror = function(event) {

    console.error("Voice error:", event.error);

    setStatus("Voice Error: " + event.error);

  };

  recognition.start();

}


/* ==================================
   AI TEACHER
================================== */

function teacherMode() {

  document.getElementById("message").value =
    "Act as my AI Teacher. Explain my question step by step in " +
    document.getElementById("language").value + ".";

  document.getElementById("message").focus();

}


/* ==================================
   STUDY PLANNER
================================== */

function studyPlanner() {

  document.getElementById("message").value =
    "Help me create a daily study timetable.";

  document.getElementById("message").focus();

}


/* ==================================
   PROGRESS TRACKER
================================== */

function progressTracker() {

  document.getElementById("message").value =
    "Help me review my study progress.";

  document.getElementById("message").focus();

}


/* ==================================
   ENTER KEY
================================== */

document.getElementById("message")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  });


/* ==================================
   PAGE INITIALIZATION
================================== */

window.addEventListener("load", async function() {

  try {

    const session = await getCurrentSession();

    if (!session || !session.user) {

      setStatus("Please log in to use your private chat.");

      return;

    }

    currentUserId = session.user.id;

    await loadConversations();

    const { data, error } = await supabaseClient
      .from("chat_conversations")
      .select("id")
      .eq("user_id", currentUserId)
      .order("updated_at", { ascending: false })
      .limit(1);

    if (error) throw error;

    if (data && data.length > 0) {

      await openConversation(data[0].id);

    } else {

      clearChatScreen();

      setStatus("Welcome! Click the menu to start a New Chat.");

    }

  } catch (error) {

    console.error("Initialization Error:", error);

    setStatus("Initialization Error: " + error.message);

  }

});

</script>
