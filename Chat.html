<!DOCTYPE html>
<html>
<head>
<title>AI Chat - Vision AI Pro</title>

<style>
body {
  background: linear-gradient(135deg, #e8f4ff, #f4f8ff);
  text-align: center;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  color: #173b63;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  margin-top: 0;
  color: #555;
}

#chatBox {
  width: 92%;
  max-width: 700px;
  height: 400px;
  margin: 20px auto;
  padding: 15px;
  background-color: white;
  border: 2px solid #4b8cc5;
  border-radius: 16px;
  overflow-y: auto;
  text-align: left;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.userMsg {
  background-color: #d8f5d0;
  padding: 12px;
  margin: 8px;
  border-radius: 12px;
  text-align: right;
  word-wrap: break-word;
}

.aiMsg {
  background-color: #e5e5ff;
  padding: 12px;
  margin: 8px;
  border-radius: 12px;
  text-align: left;
  word-wrap: break-word;
}

#message {
  width: 62%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #aaa;
  border-radius: 10px;
  box-sizing: border-box;
}

button {
  padding: 11px 16px;
  margin: 5px;
  cursor: pointer;
  border-radius: 9px;
  border: 1px solid #777;
  background-color: #3f7fc4;
  color: white;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

#language {
  padding: 11px;
  margin: 5px;
  border-radius: 9px;
}

.featureBox {
  margin: 10px auto;
  max-width: 700px;
}

.homeBtn {
  margin-top: 15px;
}

.status {
  font-size: 13px;
  color: #666;
  margin-top: 8px;
}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  h1 {
    font-size: 25px;
  }

  #chatBox {
    width: 94%;
    height: 430px;
    padding: 8px;
  }

  #message {
    width: 68%;
    font-size: 15px;
  }

  button {
    padding: 10px 12px;
    font-size: 13px;
  }

  .featureBox {
    width: 100%;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://swyvrgpapuralxngfoxd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3BE4yCQ_mcVmKDGIvG4mNQ_EtL_7J";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
</script>

</head>

<body>

<h1>🤖 Vision AI Pro</h1>

<p class="subtitle">
AI Teacher • Ask • Learn • Improve
</p>

<div class="featureBox">

<select id="language">
  <option value="English">English</option>
  <option value="Hindi">Hindi</option>
  <option value="Hinglish">Hinglish</option>
</select>

<button onclick="startVoice()">🎤 Voice</button>

<button onclick="clearChat()">🗑️ Clear</button>

</div>

<div id="chatBox">

<div class="aiMsg">
🤖 <b>AI Teacher:</b>
Hello! 😊 Ask me your question.
</div>

</div>

<input
id="message"
type="text"
placeholder="Type your question..."
>

<button onclick="sendMessage()">📤 Send</button>

<div class="featureBox">

<button onclick="teacherMode()">
👨‍🏫 AI Teacher
</button>

<button onclick="studyPlanner()">
📅 Study Planner
</button>

<button onclick="progressTracker()">
📊 Progress
</button>

</div>

<div class="homeBtn">

<a href="index.html">
<button>🏠 Home</button>
</a>

</div>

<div class="status">
Vision AI Pro • Chat ready
</div>

<script>
/* =========================
   SAVE CHAT MESSAGE
========================= */

async function saveChatMessage(sender, message) {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    console.log("User is not logged in.");
    return;
  }

  const { error } = await supabaseClient
    .from("chat_history")
    .insert({
      user_id: user.id,
      sender: sender,
      message: message
    });

  if (error) {
    console.error(
      "Chat history save error:",
      error
    );
  }
}

/* =========================
   LOAD CHAT HISTORY
========================= */

async function loadChatHistory() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    console.log("User is not logged in.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("chat_history")
    .select("sender, message, created_at")
    .eq("user_id", user.id)
    .order("created_at", {
      ascending: true
    });

  if (error) {
    console.error(
      "Chat history load error:",
      error
    );
    return;
  }

  const box = document.getElementById("chatBox");

  if (data && data.length > 0) {
    box.innerHTML = "";

    data.forEach(function(item) {
      if (item.sender === "user") {
        addUserMessage(
          item.message,
          false
        );
      } else {
        addAIMessage(
          item.message,
          false
        );
      }
    });
  }

  box.scrollTop = box.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
  let input = document.getElementById("message");
  let text = input.value.trim();

  if (text === "") {
    return;
  }

  addUserMessage(text);
  input.value = "";

  await saveChatMessage(
    "user",
    text
  );

  setTimeout(async function() {
    let answer = getDemoAnswer(text);
    addAIMessage(answer);

    await saveChatMessage(
      "ai",
      answer
    );
  }, 500);
}

/* =========================
   USER MESSAGE
========================= */

function addUserMessage(
  text,
  scroll = true
) {
  let box = document.getElementById("chatBox");

  box.innerHTML +=
    "<div class='userMsg'>" +
    "👤 <b>You:</b> " +
    escapeHTML(text) +
    "</div>";

  if (scroll) {
    box.scrollTop = box.scrollHeight;
  }
}

/* =========================
   AI MESSAGE
========================= */

function addAIMessage(
  text,
  scroll = true
) {
  let box = document.getElementById("chatBox");

  box.innerHTML +=
    "<div class='aiMsg'>" +
    "🤖 <b>AI Teacher:</b> " +
    escapeHTML(text) +
    "</div>";

  if (scroll) {
    box.scrollTop = box.scrollHeight;
  }
}

/* =========================
   SAFE TEXT
========================= */

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================
   DEMO AI
========================= */

function getDemoAnswer(text) {
  let lower = text.toLowerCase();

  if (
    lower.includes("hello") ||
    lower.includes("hi")
  ) {
    return "Hello bhai! 😊 I am your Vision AI Pro teacher.";
  }

  if (lower.includes("math")) {
    return "Sure! 📚 Send me the Maths question and I will help you step by step.";
  }

  if (lower.includes("science")) {
    return "Sure! 🔬 Send me the Science question and I will explain it simply.";
  }

  if (lower.includes("english")) {
    return "Sure! 📖 Send me your English question and I will help you.";
  }

  if (lower.includes("sst")) {
    return "Sure! 🌍 Send me your SST question and I will explain it.";
  }

  return "I received your question. 🤖 Real AI answers will be connected in a later stage.";
}

/* =========================
   VOICE
========================= */

function startVoice() {
  if (
    !("webkitSpeechRecognition" in window)
  ) {
    alert(
      "Voice input is not supported in this browser."
    );
    return;
  }

  let recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById(
      "message"
    ).value =
      event.results[0][0].transcript;
  };
}

/* =========================
   CLEAR CHAT SCREEN
========================= */

function clearChat() {
  document.getElementById(
    "chatBox"
  ).innerHTML =
    "<div class='aiMsg'>" +
    "🤖 <b>AI Teacher:</b> " +
    "Chat cleared. Ask me something new! 😊" +
    "</div>";
}

/* =========================
   AI TEACHER
========================= */

function teacherMode() {
  addAIMessage(
    "👨‍🏫 AI Teacher Mode is ready. Ask your school question and I will explain it step by step."
  );
}

/* =========================
   STUDY PLANNER
========================= */

function studyPlanner() {
  addAIMessage(
    "📅 Study Planner: In the next step we can add subjects, study time, daily targets and a simple timetable."
  );
}

/* =========================
   PROGRESS TRACKER
========================= */

function progressTracker() {
  addAIMessage(
    "📊 Progress Tracker: In the next step we can save completed quizzes, questions solved and study progress."
  );
}

/* =========================
   ENTER KEY
========================= */

document.getElementById(
  "message"
).addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }
);

/* =========================
   LOAD HISTORY
========================= */

window.addEventListener(
  "load",
  function() {
    loadChatHistory();
  }
);
</script>

</body>
</html>
