<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision-AI-Pro | Admin Review</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      margin: 0;
      padding: 20px;
    }
    main { max-width: 950px; margin: auto; }
    h1 { color: #263c80; }
    .card {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000012;
    }
    label { display: block; margin-top: 12px; font-weight: bold; }
    select, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 15px;
    }
    textarea { min-height: 75px; resize: vertical; }
    button {
      background: #263c80;
      color: white;
      border: 0;
      cursor: pointer;
      margin-top: 14px;
    }
    .muted { color: #667085; font-size: 14px; }
    .error { color: #b42318; }
    .success { color: #067647; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Vision-AI-Pro Admin Review</h1>
  <p class="muted">Private suggestion review panel</p>
  <div id="message" class="card">Checking admin access...</div>
  <section id="suggestions" class="hidden"></section>
</main>

<script src="phase5.js"></script>
<script>
(async function () {
  const message = document.getElementById("message");
  const container = document.getElementById("suggestions");
  const supabaseClient = window.VAP_SB;

  function showMessage(text, className = "") {
    message.className = "card " + className;
    message.textContent = text;
  }

  if (!supabaseClient) {
    showMessage("Supabase connection not found. Check phase5.js.", "error");
    return;
  }

  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError || !sessionData.session) {
    showMessage("Please sign in with your Vision-AI-Pro account first.", "error");
    return;
  }

  const { data: isAdmin, error: adminError } =
    await supabaseClient.rpc("is_admin");

  if (adminError || isAdmin !== true) {
    showMessage("Access denied. This account is not an authorized admin.", "error");
    return;
  }

  showMessage("Admin access verified. Loading suggestions...", "success");
  container.classList.remove("hidden");

  async function loadSuggestions() {
    container.replaceChildren();

    const { data, error } = await supabaseClient
      .from("feature_suggestions")
      .select("id, user_id, suggestion_type, title, description, status, reviewed_by, reviewed_at, updated_at, admin_notes")
      .order("created_at", { ascending: false });

    if (error) {
      showMessage("Could not load suggestions: " + error.message, "error");
      return;
    }

    if (!data || data.length === 0) {
      showMessage("No suggestions have been submitted yet.", "success");
      return;
    }

    showMessage("Loaded " + data.length + " suggestion(s).", "success");

    data.forEach(function (item) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = item.title || "(Untitled suggestion)";
      card.appendChild(title);
 const meta = document.createElement("p");
      meta.className = "muted";
      meta.textContent =
        "Type: " + (item.suggestion_type || "unknown") +
        " | Status: " + (item.status || "submitted");
      card.appendChild(meta);
 const description = document.createElement("p");
      description.textContent = item.description || "";
      card.appendChild(description);

      const user = document.createElement("p");
      user.className = "muted";
      user.textContent = "User ID: " + item.user_id;
      card.appendChild(user);

      const statusLabel = document.createElement("label");
      statusLabel.textContent = "Review status";
      card.appendChild(statusLabel);
const status = document.createElement("select");
      [
        ["submitted", "Submitted"],
        ["under_review", "Under review"],
        ["planned", "Planned"],
        ["completed", "Completed"],
        ["rejected", "Rejected"]
      ].forEach(function (optionData) {
        const option = document.createElement("option");
        option.value = optionData[0];
        option.textContent = optionData[1];
        status.appendChild(option);
      });
      status.value = item.status || "submitted";
      card.appendChild(status);

      const noteLabel = document.createElement("label");
      noteLabel.textContent = "Admin notes";
      card.appendChild(noteLabel);

      const notes = document.createElement("textarea");
      notes.value = item.admin_notes || "";
      notes.placeholder = "Private review notes...";
      card.appendChild(notes);
 const saveButton = document.createElement("button");
      saveButton.textContent = "Save review";
      saveButton.addEventListener("click", async function () {
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
const { error: saveError } = await supabaseClient
          .from("feature_suggestions")
          .update({
            status: status.value,
            admin_notes: notes.value,
            reviewed_by: sessionData.session.user.id,
            reviewed_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          })
          .eq("id", item.id);
 if (saveError) {
          showMessage("Save failed: " + saveError.message, "error");
          saveButton.disabled = false;
          saveButton.textContent = "Save review";
          return;
        }
  item.status = status.value;
        item.admin_notes = notes.value;
        showMessage("Review saved successfully!", "success");
        saveButton.disabled = false;
        saveButton.textContent = "Save review";
      });
card.appendChild(saveButton);
      container.appendChild(card);
    });
  }
await loadSuggestions();
})();
</script>
</body>
</html>
