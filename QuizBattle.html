<!DOCTYPE html>
<html>
<head>
<title>Quiz Battle</title>
</head>
<body style="background-color:lightblue;text-align:center;">
<h1>🏆 Quiz Battle</h1>
<p>Welcome to Quiz Battle!</p>
  <h2>Select Subject</h2>
<button onClick="startQuiz('Math')">Math</button>
<button>🔬 Science</button>
<button>📖 English</button>
<button>🌍 SST</button>
<a href="index.html"><button>🏠 Home</button></a>
  <div id="quizArea"></div>
  <script>
function startQuiz(subject) {

document.getElementById("quizArea").innerHTML = 
"<h2>" + subject + " Quiz</h2>" + 
"<p>Question 1: 5 + 3 = ?</p>" + 
"<button onclick='checkAnswer(6)'>6</button>" + 
"<button onclick='checkAnswer(7)'>7</button>" + 
"<button onclick='checkAnswer(8)'>8</button>" + 
"<button onclick='checkAnswer(9)'>9</button>" + 
"<p id='result'></p>" + 
"<button id='nextBtn' onclick='nextQuestion()' style='display: none;'>➡️ Next Question</button>";
}

function checkAnswer(answer) {
if (answer === 8) {

document.getElementById("result").innerHTML = "Correct! ✅";
} else {

document.getElementById("result").innerHTML = "Wrong! ❌";
}

document.getElementById("nextBtn").style.display = "inline-block";
}
</script>
</body>
</html>
