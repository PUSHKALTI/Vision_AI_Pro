<!DOCTYPE html>
<html>
<head>
    <title>Vision AI Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="phase5.js"></script>
    <style>
        body {
            background-color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
        }
        h1 {
            color: #222;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            margin-bottom: 25px;
        }
        .menu-button {
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .chat {
            background-color: #20b85a;
        }
        .photo {
            background-color: #2878e8;
        }
        .image {
            background-color: #e83e5b;
        }
        .quiz {
            background-color: orange;
        }
        .top-right {
            position: absolute;
            top: 18px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-status {
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 9px 12px;
            border-radius: 20px;
            background: #f1f3f5;
            color: #333;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
            cursor: pointer;
        }
        .login-status.logged-in {
            background: #e8f8ee;
            color: #16803c;
        }
        .settings-icon {
            text-decoration: none;
            font-size: 25px;
            background: #f1f3ff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }
        .settings-icon:hover {
            transform: rotate(20deg);
        }
        .menu-button:hover {
            opacity: 0.9;
        }
        .login-status:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="top-right">
        <a href="Login.html" id="loginStatus" class="login-status">⚫ Login</a>
        <a href="Setting.html" class="settings-icon" title="Setting">⚙️</a>
    </div>
    <h1>Vision AI Pro</h1>
    <p>Welcome to Vision AI Pro</p>
    <a href="Chat.html">
        <button class="menu-button chat">💬 AI Chat</button>
    </a>
    <a href="PhotoSolver.html">
        <button class="menu-button photo">📷 Photo Solver</button>
    </a>
    <a href="ImageGenerator.html">
        <button class="menu-button image">🖼️ Image Generator</button>
    </a>
    <a href="QuizBattle.html">
        <button class="menu-button quiz">🎯 Quiz Battle</button>
    </a>
    <script>
        const loginStatus = document.getElementById("loginStatus");
        async function updateLoginStatus() {
            if (!window.VAP_SB) {
                console.log("Supabase client not found.");
                return;
            }
            const { data } = await window.VAP_SB.auth.getSession();
            if (data.session) {
                loginStatus.textContent = "🟢 Logged in";
                loginStatus.classList.add("logged-in");
                loginStatus.href = "Account.html";
            } else {
                loginStatus.textContent = "⚫ Login";
                loginStatus.classList.remove("logged-in");
                loginStatus.href = "Login.html";
            }
        }
        updateLoginStatus();
        if (window.VAP_SB) {
            window.VAP_SB.auth.onAuthStateChange(function () {
                updateLoginStatus();
            });
        }
    </script>
</body>
</html>
