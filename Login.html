<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision-AI-Pro • Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="phase5.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:#fff;
background:linear-gradient(135deg,#06101f,#101d3b 55%,#071b2e);
}

.wrap{
max-width:520px;
margin:auto;
padding:38px 18px;
}

.brand{
text-align:center;
margin-bottom:20px;
}

.logo{
width:72px;
height:72px;
margin:auto auto 12px;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
background:linear-gradient(135deg,#6575ff,#2fd5ff);
}

h1{
margin:0;
font-size:30px;
}

h2{
margin-top:0;
}

.tag,.sub{
color:#aebbd0;
}

.card{
padding:24px;
border-radius:24px;
background:#0d1a32;
border:1px solid #ffffff1c;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:12px;
border:1px solid #ffffff18;
border-radius:12px;
background:#ffffff0b;
color:#b9c5d8;
font-weight:bold;
cursor:pointer;
}

.tabs .active{
background:linear-gradient(135deg,#6575ff,#2fd5ff);
color:#fff;
}

label{
display:block;
margin:15px 0 7px;
font-size:14px;
font-weight:bold;
}

input{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #ffffff1c;
background:#ffffff0a;
color:#fff;
outline:none;
font-size:15px;
}

.pass{
position:relative;
}

.pass input{
padding-right:48px;
}

.eye{
position:absolute;
right:6px;
top:5px;
border:0;
background:transparent;
color:#cbd7ea;
font-size:18px;
cursor:pointer;
padding:8px;
}

.main{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#6575ff,#2fd5ff);
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.main:disabled{
opacity:.6;
cursor:not-allowed;
}

.msg{
min-height:18px;
margin-top:13px;
font-size:13px;
line-height:1.45;
}

.ok,.err{
padding:10px 12px;
border-radius:10px;
}

.ok{
color:#8ff1c4;
background:#43e0a114;
}

.err{
color:#ffabb5;
background:#ff6b7a14;
}

.home{
display:block;
text-align:center;
color:#bfeaff;
text-decoration:none;
margin-top:18px;
}

.note{
margin-top:17px;
padding:11px;
border-radius:12px;
background:#ffffff08;
color:#aebbd0;
font-size:12px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="wrap">

<div class="brand">
<div class="logo">🤖</div>
<h1>Vision-AI-Pro</h1>
<div class="tag">Your AI learning companion</div>
</div>

<div class="card">

<div class="tabs">
<button id="lt" class="active" type="button" onclick="showLogin()">Login</button>
<button id="st" type="button" onclick="showSignup()">Sign-up</button>
</div>

<!-- LOGIN -->

<section id="loginBox">

<h2>Welcome back</h2>

<p class="sub">
Login to continue to Vision-AI-Pro.
</p>

<label>Email</label>

<input
id="loginEmail"
type="email"
autocomplete="email"
placeholder="Enter your email">

<label>Password</label>

<div class="pass">

<input
id="loginPassword"
type="password"
autocomplete="current-password"
placeholder="Enter your password">

<button
class="eye"
type="button"
onclick="togglePassword('loginPassword',this)">
◉
</button>

</div>

<button
id="loginBtn"
class="main"
type="button"
onclick="loginUser()">
Login
</button>

<div id="loginMsg" class="msg"></div>

</section>


<!-- SIGN UP -->

<section id="signupBox" class="hidden">

<h2>Create your account</h2>

<p class="sub">
Create an account to keep your Vision-AI-Pro data.
</p>

<label>Email</label>

<input
id="signupEmail"
type="email"
autocomplete="email"
placeholder="Enter your email">

<label>Password</label>

<div class="pass">

<input
id="signupPassword"
type="password"
autocomplete="new-password"
placeholder="Create a password">

<button
class="eye"
type="button"
onclick="togglePassword('signupPassword',this)">
◉
</button>

</div>

<label>Confirm password</label>

<div class="pass">

<input
id="signupConfirm"
type="password"
autocomplete="new-password"
placeholder="Type password again">

<button
class="eye"
type="button"
onclick="togglePassword('signupConfirm',this)">
◉
</button>

</div>

<button
id="signupBtn"
class="main"
type="button"
onclick="signupUser()">
Create account
</button>

<div id="signupMsg" class="msg"></div>

</section>


<a class="home" href="index.html">
← Back to Home
</a>

<div class="note">
🔐 Secure authentication powered by Supabase.
</div>

</div>
</div>


<script>

function showLogin(){

document.getElementById("loginBox").classList.remove("hidden");

document.getElementById("signupBox").classList.add("hidden");

document.getElementById("lt").className="active";

document.getElementById("st").className="";
}


function showSignup(){

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("signupBox").classList.remove("hidden");

document.getElementById("lt").className="";

document.getElementById("st").className="active";
}


function togglePassword(id,btn){

const input=document.getElementById(id);

if(input.type==="password"){

input.type="text";
btn.textContent="○";

}else{

input.type="password";
btn.textContent="◉";

}

}


function validEmail(email){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}


function msg(id,text,ok){

const element=document.getElementById(id);

element.className="msg "+(ok?"ok":"err");

element.textContent=text;

}


function getSupabase(){

if(!window.VAP_SB){

throw new Error(
"Supabase connection is not ready. Please check phase5.js."
);

}

return window.VAP_SB;

}


/* LOGIN */

async function loginUser(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;

if(!validEmail(email)){

msg(
"loginMsg",
"Please enter a valid email.",
false
);

return;

}

if(!password){

msg(
"loginMsg",
"Please enter your password.",
false
);

return;

}

const button=
document.getElementById("loginBtn");

button.disabled=true;
button.textContent="Logging in...";

try{

const supabase=getSupabase();

const result=
await supabase.auth.signInWithPassword({

email:email,
password:password

});

if(result.error){

throw result.error;

}

msg(
"loginMsg",
"Login successful. Opening Vision-AI-Pro...",
true
);

setTimeout(function(){

window.location.href="index.html";

},700);

}catch(error){

msg(
"loginMsg",
error.message || "Login failed.",
false
);

}finally{

button.disabled=false;
button.textContent="Login";

}

}


/* SIGN UP */

async function signupUser(){

const email=
document.getElementById("signupEmail").value.trim();

const password=
document.getElementById("signupPassword").value;

const confirm=
document.getElementById("signupConfirm").value;


if(!validEmail(email)){

msg(
"signupMsg",
"Please enter a valid email.",
false
);

return;

}


if(password.length<6){

msg(
"signupMsg",
"Password should be at least 6 characters.",
false
);

return;

}


if(password!==confirm){

msg(
"signupMsg",
"Passwords do not match.",
false
);

return;

}


const button=
document.getElementById("signupBtn");

button.disabled=true;
button.textContent="Creating account...";


try{

const supabase=getSupabase();


const result=
await supabase.auth.signUp({

email:email,

password:password,

options:{
emailRedirectTo:
"https://pushkalti.github.io/Vision_AI_Pro/Login.html"
}

});


if(result.error){

throw result.error;

}


/*
When email confirmation is ON,
Supabase normally returns no session
until the user confirms the email.
*/

if(result.data && result.data.session){

msg(
"signupMsg",
"Account created. Opening Vision-AI-Pro...",
true
);

setTimeout(function(){

window.location.href="index.html";

},700);

}else{

msg(
"signupMsg",
"Account created. Please check your email and confirm your account, then login.",
true
);

}

}catch(error){

msg(
"signupMsg",
error.message || "Sign-up failed.",
false
);

}finally{

button.disabled=false;
button.textContent="Create account";

}

}

</script>

</body>
</html>
